<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>조선 호랑이 뜀박질</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        overflow: hidden;
        background: #efe6d6;
        color: #3f362c;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui,
          -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        color: #7a684f;
      }
      .stage {
        width: 100%;
        max-width: 800px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 800 / 300;
        background: #fdf8ef;
        border: 2px solid #cbb896;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(90, 70, 40, 0.15);
        touch-action: manipulation;
      }
      .hint {
        margin: 0;
        font-size: 0.85rem;
        color: #8a7a63;
        text-align: center;
        line-height: 1.7;
      }
      kbd {
        background: #fffdf8;
        border: 1px solid #cbb896;
        border-bottom-width: 2px;
        border-radius: 5px;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 0.78rem;
        color: #6b5a44;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #241f19;
          color: #d8ccb8;
        }
        h1 {
          color: #b6a284;
        }
        .hint {
          color: #9d8c72;
        }
      }
    </style>
  </head>
  <body>
    <h1>조선 호랑이 뜀박질</h1>
    <div class="stage">
      <canvas id="game" width="800" height="300"></canvas>
    </div>
    <p class="hint"><kbd>Space</kbd> <kbd>↑</kbd> 또는 화면 탭 — 점프</p>

    <script>
      (function () {
        "use strict";

        // ============================================================
        // 캔버스 준비
        // ============================================================
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");

        var W = 800; // 논리 가로
        var H = 300; // 논리 세로
        var GROUND_Y = 250; // 흙길 바닥선

        // 고해상도 화면에서 선이 뭉개지지 않도록 백버퍼만 키운다.
        // 이후 모든 좌표는 논리 좌표(800x300) 기준으로 쓴다.
        var DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        // ============================================================
        // 튜닝 상수
        // ============================================================
        var BASE_SPEED = 5; // 시작 속도
        var MAX_SPEED = 13; // 속도 상한
        var GRAVITY = 0.66; // 프레임당 중력
        var JUMP_FORCE = 12; // 점프 초기 속도
        var MAX_DT = 3; // 델타 타임 상한 (탭 복귀 시 순간이동 방지)
        var AIR_FROM = 300; // 공중 장애물이 나오기 시작하는 점수
        var RESTART_DELAY = 500; // 게임오버 직후 오조작 방지 (ms)
        var STORAGE_KEY = "joseon-tiger-run.hi";

        // 히트박스는 그림보다 작게 잡아 판정을 관대하게 한다.
        // (플레이어 발 위치 player.y 기준 상대 좌표)
        var HB = { dx: 7, dy: -47, w: 43, h: 45 };

        // ============================================================
        // 상태 (PRD 3. 상태 관리)
        // ============================================================
        var gameState = "START"; // 'START' | 'PLAYING' | 'GAMEOVER'
        var score = 0;
        var highScore = loadHighScore();
        var gameSpeed = BASE_SPEED;
        var obstacles = [];

        var player = {
          x: 62,
          y: GROUND_Y, // 발 위치 = 바닥 높이
          vy: 0,
          w: 46,
          h: 48,
          isGrounded: true,
          runPhase: 0
        };

        // 내부 보조 상태
        var milestone = 0; // 지나온 100점 구간 수
        var flashTimer = 0; // 100점 강조 깜빡임 잔여 프레임
        var isNewRecord = false;
        var gameOverAt = 0;
        var spawnGap = 0; // 다음 장애물까지 남은 거리(px)
        var tick = 0; // 전역 애니메이션 시계(프레임)
        var bgFar = 0;
        var bgMid = 0;
        var bgNear = 0;
        var rafId = null;
        var lastTs = 0;

        // ============================================================
        // 최고 점수 (LocalStorage)
        // ============================================================
        function loadHighScore() {
          try {
            return parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0;
          } catch (e) {
            return 0; // 시크릿 모드 등으로 막혀도 게임 자체는 굴러가게 둔다
          }
        }
        function saveHighScore(v) {
          try {
            localStorage.setItem(STORAGE_KEY, String(v));
          } catch (e) {}
        }

        // ============================================================
        // 효과음 (외부 파일 없이 WebAudio로 생성)
        // ============================================================
        var audioCtx = null;
        function initAudio() {
          if (audioCtx) {
            if (audioCtx.state === "suspended") audioCtx.resume();
            return;
          }
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
          } catch (e) {
            audioCtx = null;
          }
        }
        function beep(freq, dur, type, vol) {
          if (!audioCtx || audioCtx.state !== "running") return;
          var t0 = audioCtx.currentTime;
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = type || "square";
          osc.frequency.setValueAtTime(freq, t0);
          gain.gain.setValueAtTime(vol || 0.05, t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + dur);
        }

        // ============================================================
        // 입력 (PRD 5. 키 기본 동작 차단 / 다중 점프 방지)
        // ============================================================
        function onJumpInput() {
          initAudio();

          if (gameState === "START") {
            startGame();
            return;
          }

          if (gameState === "PLAYING") {
            if (player.isGrounded) {
              // 착지 상태에서만 점프 -> 공중 2단 점프 차단
              player.vy = -JUMP_FORCE;
              player.isGrounded = false;
              beep(520, 0.09, "square", 0.05);
            }
            return;
          }

          if (gameState === "GAMEOVER") {
            if (performance.now() - gameOverAt > RESTART_DELAY) startGame();
          }
        }

        window.addEventListener(
          "keydown",
          function (e) {
            var k = e.code;
            if (k === "Space" || k === "ArrowUp" || k === "ArrowDown") {
              e.preventDefault(); // 페이지 스크롤 차단
            }
            if (e.repeat) return; // 키를 누르고 있을 때의 자동 반복 무시
            if (k === "Space" || k === "ArrowUp" || k === "KeyW") onJumpInput();
          },
          { passive: false }
        );

        document.addEventListener(
          "touchstart",
          function (e) {
            e.preventDefault(); // 모바일 스크롤 / 더블탭 확대 차단
            onJumpInput();
          },
          { passive: false }
        );

        document.addEventListener("mousedown", function (e) {
          e.preventDefault();
          onJumpInput();
        });

        // 탭 전환으로 rAF가 멈췄다 돌아오면 델타 기준 시각을 다시 잡는다.
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) lastTs = 0;
        });
        window.addEventListener("blur", function () {
          lastTs = 0;
        });

        // ============================================================
        // 게임 진행 제어
        // ============================================================
        function initRun() {
          score = 0;
          gameSpeed = BASE_SPEED;
          obstacles = [];
          milestone = 0;
          flashTimer = 0;
          isNewRecord = false;
          spawnGap = 340;
          player.y = GROUND_Y;
          player.vy = 0;
          player.isGrounded = true;
          player.runPhase = 0;
        }

        function startGame() {
          initRun();
          gameState = "PLAYING";
          if (rafId === null) {
            lastTs = 0;
            rafId = requestAnimationFrame(loop);
          }
        }

        function endGame() {
          gameState = "GAMEOVER";
          gameOverAt = performance.now();
          var final = Math.floor(score);
          if (final > highScore) {
            highScore = final;
            isNewRecord = true;
            saveHighScore(highScore);
          }
          beep(190, 0.22, "sawtooth", 0.07);
          setTimeout(function () {
            beep(120, 0.34, "sawtooth", 0.06);
          }, 110);
        }

        // ============================================================
        // 장애물 생성
        // ============================================================
        function nextGap() {
          // 최소 간격은 점프 체공 거리보다 항상 넉넉하게 잡아
          // 어떤 속도에서도 넘을 수 없는 배치가 안 나오게 한다.
          var min = 280 + gameSpeed * 26;
          return min + Math.random() * 220;
        }

        function spawnObstacle() {
          if (score >= AIR_FROM && Math.random() < 0.32) spawnAir();
          else spawnGround();
        }

        function spawnGround() {
          if (Math.random() < 0.5) {
            // 돌탑: 돌 2~4개
            var n = 2 + Math.floor(Math.random() * 3);
            var w = 26 + n * 3;
            var h = n * 14 + 11;
            obstacles.push({
              kind: "doltap",
              stones: n,
              x: W,
              y: GROUND_Y - h,
              w: w,
              h: h,
              pad: 4
            });
          } else {
            // 장승: 1~2기
            var posts = Math.random() < 0.3 ? 2 : 1;
            var ph = 58 + Math.floor(Math.random() * 16);
            obstacles.push({
              kind: "jangseung",
              posts: posts,
              x: W,
              y: GROUND_Y - ph,
              w: posts === 2 ? 46 : 22,
              h: ph,
              pad: 3
            });
          }
        }

        function spawnAir() {
          var kind = Math.random() < 0.5 ? "fire" : "crow";
          var low = Math.random() < 0.55;
          obstacles.push({
            kind: kind,
            x: W,
            // low  : 달리는 몸에 걸린다 -> 반드시 점프
            // high : 머리 위로 지나간다 -> 뛰지 말고 그대로 통과
            y: GROUND_Y - (low ? 60 : 120),
            w: kind === "fire" ? 24 : 38,
            h: kind === "fire" ? 30 : 26,
            pad: 4,
            seed: Math.random() * 100
          });
        }

        // ============================================================
        // 충돌 판정 (AABB)
        // ============================================================
        function hitTest() {
          var px = player.x + HB.dx;
          var py = player.y + HB.dy;
          for (var i = 0; i < obstacles.length; i++) {
            var o = obstacles[i];
            var ox = o.x + o.pad;
            var oy = o.y + o.pad;
            var ow = o.w - o.pad * 2;
            var oh = o.h - o.pad * 2;
            if (
              px < ox + ow &&
              px + HB.w > ox &&
              py < oy + oh &&
              py + HB.h > oy
            ) {
              return true;
            }
          }
          return false;
        }

        // ============================================================
        // 업데이트
        // ============================================================
        function update(dt) {
          tick += dt;

          // 배경 시차 스크롤 (대기 화면에서는 느리게)
          var spd = gameState === "PLAYING" ? gameSpeed : BASE_SPEED * 0.6;
          bgFar += spd * 0.12 * dt;
          bgMid += spd * 0.35 * dt;
          bgNear += spd * dt;

          if (player.isGrounded) {
            player.runPhase = (player.runPhase + spd * 0.022 * dt) % 1;
          }

          if (gameState !== "PLAYING") return;

          // --- 물리: 중력 적용 후 바닥 착지 처리 ---
          player.vy += GRAVITY * dt;
          player.y += player.vy * dt;
          if (player.y >= GROUND_Y) {
            player.y = GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;
          }

          // --- 점수: 프레임당 1점 ---
          score += dt;
          var m = Math.floor(score / 100);
          if (m > milestone) {
            milestone = m;
            flashTimer = 42; // 100점 시각 강조
            beep(880, 0.08, "square", 0.05);
            setTimeout(function () {
              beep(1320, 0.1, "square", 0.05);
            }, 90);
          }
          if (flashTimer > 0) flashTimer -= dt;

          // --- 난이도: 100점 구간마다 속도 상승 ---
          gameSpeed = Math.min(MAX_SPEED, BASE_SPEED + milestone * 0.3);

          // --- 장애물 이동 및 화면 밖 제거 ---
          for (var i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].x -= gameSpeed * dt;
            if (obstacles[i].x + obstacles[i].w < -20) obstacles.splice(i, 1);
          }

          // --- 장애물 생성 ---
          spawnGap -= gameSpeed * dt;
          if (spawnGap <= 0) {
            spawnObstacle();
            spawnGap = nextGap();
          }

          // --- 충돌 시 즉시 종료 ---
          if (hitTest()) endGame();
        }

        // ============================================================
        // 그리기 헬퍼
        // ============================================================
        function roundRect(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function line(x1, y1, x2, y2) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        function pad5(n) {
          var s = String(Math.max(0, Math.floor(n)));
          while (s.length < 5) s = "0" + s;
          return s;
        }

        // ============================================================
        // 배경
        // ============================================================
        var FAR_RIDGE = [
          0, 58, 42, 26, 80, 50, 124, 14, 168, 44, 210, 22, 252, 52, 296, 30,
          340, 58, 372, 40, 400, 58
        ];
        var NEAR_RIDGE = [
          0, 44, 36, 18, 74, 40, 112, 10, 150, 36, 190, 16, 228, 42, 266, 22,
          302, 46, 340, 44
        ];

        function drawSky() {
          var g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
          g.addColorStop(0, "#f7e4c9");
          g.addColorStop(0.55, "#fbf1e2");
          g.addColorStop(1, "#fdf8ef");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, GROUND_Y);

          ctx.fillStyle = "rgba(233,150,90,0.28)";
          ctx.beginPath();
          ctx.arc(W - 132, 64, 27, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(240,172,108,0.5)";
          ctx.beginPath();
          ctx.arc(W - 132, 64, 18, 0, Math.PI * 2);
          ctx.fill();
        }

        function cloud(x, y, s) {
          ctx.beginPath();
          ctx.arc(x, y, 12 * s, 0, Math.PI * 2);
          ctx.arc(x + 14 * s, y - 5 * s, 15 * s, 0, Math.PI * 2);
          ctx.arc(x + 30 * s, y, 11 * s, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawClouds() {
          ctx.fillStyle = "rgba(255,255,255,0.7)";
          var tileW = 300;
          var off = (bgFar * 0.6) % tileW;
          var n = Math.ceil(W / tileW) + 2;
          for (var t = -1; t < n; t++) {
            var bx = t * tileW - off;
            cloud(bx + 40, 46, 1);
            cloud(bx + 190, 78, 0.7);
          }
        }

        function drawRidge(offset, tileW, pts, topY, color) {
          var n = Math.ceil(W / tileW) + 2;
          var start = -(offset % tileW);
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(start, H);
          for (var t = 0; t < n; t++) {
            var bx = start + t * tileW;
            for (var i = 0; i < pts.length; i += 2) {
              ctx.lineTo(bx + pts[i], topY + pts[i + 1]);
            }
          }
          ctx.lineTo(start + n * tileW, H);
          ctx.closePath();
          ctx.fill();
        }

        // 기와집 실루엣: 가운데가 처지고 양끝이 들린 처마 + 낮은 벽체
        function hanok(x, baseY, w, s) {
          var bw = w * s;
          var wallH = 21 * s;
          var roofH = 19 * s;
          var eaveY = baseY - wallH; // 처마 밑선
          var ridgeY = eaveY - roofH; // 용마루
          var tipY = eaveY - roofH * 0.2; // 들린 처마 끝

          ctx.fillRect(x + bw * 0.16, eaveY, bw * 0.68, wallH);

          ctx.beginPath();
          ctx.moveTo(x - bw * 0.1, tipY);
          // 처마 밑선: 가운데로 처졌다가 반대쪽 끝에서 다시 들린다
          ctx.quadraticCurveTo(
            x + bw * 0.5,
            eaveY + roofH * 0.34,
            x + bw * 1.1,
            tipY
          );
          ctx.quadraticCurveTo(
            x + bw * 0.82,
            ridgeY + roofH * 0.12,
            x + bw * 0.8,
            ridgeY
          );
          ctx.lineTo(x + bw * 0.2, ridgeY);
          ctx.quadraticCurveTo(
            x + bw * 0.18,
            ridgeY + roofH * 0.12,
            x - bw * 0.1,
            tipY
          );
          ctx.closePath();
          ctx.fill();

          ctx.fillRect(x + bw * 0.18, ridgeY - 2.5 * s, bw * 0.64, 3 * s);
        }

        function drawHanok() {
          // 뒤쪽 산(#aab7c3)보다 어둡게 칠해야 실루엣이 구분된다.
          ctx.fillStyle = "#798794";
          var tileW = 270;
          var off = bgMid % tileW;
          var n = Math.ceil(W / tileW) + 2;
          for (var t = -1; t < n; t++) {
            var bx = t * tileW - off;
            hanok(bx + 26, 222, 98, 1);
            hanok(bx + 158, 226, 74, 0.78);
          }
        }

        function drawGround() {
          ctx.fillStyle = "#ddcdb0";
          ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

          ctx.strokeStyle = "#93805f";
          ctx.lineWidth = 2;
          line(0, GROUND_Y + 1, W, GROUND_Y + 1);

          // 흙길 결 / 자갈
          ctx.fillStyle = "#bfab86";
          var tileW = 120;
          var off = bgNear % tileW;
          var marks = [8, 14, 30, 26, 52, 9, 74, 32, 96, 20, 112, 38];
          var n = Math.ceil(W / tileW) + 2;
          for (var t = -1; t < n; t++) {
            var bx = t * tileW - off;
            for (var i = 0; i < marks.length; i += 2) {
              ctx.fillRect(bx + marks[i], GROUND_Y + marks[i + 1], 7, 2);
            }
          }
        }

        // ============================================================
        // 장애물 그리기
        // ============================================================
        function drawDoltap(o) {
          var cx = o.x + o.w / 2;
          var y = GROUND_Y;
          for (var i = 0; i < o.stones; i++) {
            var sw = o.w - i * 5;
            ctx.fillStyle = i % 2 ? "#8f8c86" : "#a6a39c";
            roundRect(cx - sw / 2, y - 13, sw, 13, 5);
            ctx.fill();
            ctx.fillStyle = "rgba(0,0,0,0.13)";
            roundRect(cx - sw / 2, y - 3, sw, 3, 1.5);
            ctx.fill();
            y -= 14;
          }
          ctx.fillStyle = "#b8b5ae";
          ctx.beginPath();
          ctx.ellipse(cx, y - 5, 7, 6, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawPost(x, top, w, h, isRed) {
          ctx.fillStyle = isRed ? "#7d4b39" : "#5f4a3b";
          roundRect(x, top + 10, w, h - 10, 3);
          ctx.fill();

          ctx.fillStyle = "#3a2e26"; // 머리 위 갓
          roundRect(x - 4, top, w + 8, 11, 3);
          ctx.fill();

          ctx.fillStyle = "#f2ece2"; // 눈
          ctx.beginPath();
          ctx.arc(x + w * 0.32, top + 22, 3.4, 0, Math.PI * 2);
          ctx.arc(x + w * 0.68, top + 22, 3.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#231a15";
          ctx.beginPath();
          ctx.arc(x + w * 0.32, top + 22.5, 1.7, 0, Math.PI * 2);
          ctx.arc(x + w * 0.68, top + 22.5, 1.7, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#c9a58b"; // 코
          roundRect(x + w * 0.5 - 2.5, top + 26, 5, 9, 2);
          ctx.fill();

          ctx.fillStyle = "#f2ece2"; // 이빨
          roundRect(x + w * 0.28, top + 38, w * 0.44, 5, 1.5);
          ctx.fill();
        }

        function drawJangseung(o) {
          for (var p = 0; p < o.posts; p++) {
            drawPost(o.x + p * 24, o.y, 22, o.h, p === 0);
          }
        }

        function flameShape(cx, cy, rw, rh) {
          ctx.beginPath();
          ctx.moveTo(cx, cy - rh);
          ctx.bezierCurveTo(
            cx + rw,
            cy - rh * 0.2,
            cx + rw * 0.85,
            cy + rh * 0.9,
            cx,
            cy + rh
          );
          ctx.bezierCurveTo(
            cx - rw * 0.85,
            cy + rh * 0.9,
            cx - rw,
            cy - rh * 0.2,
            cx,
            cy - rh
          );
          ctx.closePath();
          ctx.fill();
        }

        // 도깨비불
        function drawFire(o) {
          var cx = o.x + o.w / 2;
          var cy = o.y + o.h / 2;
          var f = Math.sin(tick * 0.25 + o.seed);
          var f2 = Math.sin(tick * 0.4 + o.seed * 2);
          ctx.save();
          ctx.globalAlpha = 0.32;
          ctx.fillStyle = "#7fe3d0";
          ctx.beginPath();
          ctx.ellipse(cx, cy, 16 + f * 2, 21 + f2 * 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#3ab99f";
          flameShape(cx, cy, 11 + f, 17 + f2);
          ctx.fillStyle = "#bdf6ea";
          flameShape(cx, cy + 3, 5.5, 9);
          ctx.restore();
        }

        // 까마귀
        function drawCrow(o) {
          var cx = o.x + o.w / 2;
          var cy = o.y + o.h / 2;
          var flap = Math.sin(tick * 0.3 + o.seed);

          ctx.fillStyle = "#2b2b30";
          ctx.beginPath();
          ctx.ellipse(cx, cy, 15, 8, -0.12, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath(); // 꼬리
          ctx.moveTo(cx - 13, cy - 1);
          ctx.lineTo(cx - 25, cy + 6);
          ctx.lineTo(cx - 12, cy + 5);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath(); // 머리
          ctx.arc(cx + 13, cy - 5, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#e0a33c"; // 부리
          ctx.beginPath();
          ctx.moveTo(cx + 18, cy - 6.5);
          ctx.lineTo(cx + 27, cy - 3.5);
          ctx.lineTo(cx + 18, cy - 0.5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#1c1c20"; // 날개
          ctx.beginPath();
          ctx.moveTo(cx - 2, cy - 2);
          ctx.quadraticCurveTo(
            cx - 12,
            cy - 6 - flap * 13,
            cx - 22,
            cy + 2 - flap * 10
          );
          ctx.quadraticCurveTo(cx - 12, cy + 2 - flap * 4, cx - 2, cy + 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#fff"; // 눈
          ctx.beginPath();
          ctx.arc(cx + 14, cy - 6, 1.6, 0, Math.PI * 2);
          ctx.fill();
        }

        function drawObstacle(o) {
          if (o.kind === "doltap") drawDoltap(o);
          else if (o.kind === "jangseung") drawJangseung(o);
          else if (o.kind === "fire") drawFire(o);
          else drawCrow(o);
        }

        // ============================================================
        // 플레이어: 뿔과 방망이를 든 아기 호랑이
        // ============================================================
        // 더피와 같은 종의 호랑이 색: 하늘색 몸에 진한 파란 줄무늬, 호박색 눈, 흰 발
        var FUR = "#3fa9e0"; // 몸 기본색
        var FUR_D = "#2b8ec7"; // 그늘진 부분 (귀 바깥, 뒷다리)
        var BELLY = "#8ed3f2"; // 배, 가슴
        var STRIPE = "#1b6ba3"; // 줄무늬, 이마 무늬
        var INK = "#1d1d1f"; // 윤곽선, 코, 입
        var EYE = "#ff6a12"; // 눈 (진한 형광 주황)
        var EYE_RIM = "#d8410a"; // 눈 바깥 테두리
        var EYE_HOT = "#ffab3d"; // 눈 안쪽 밝은 심지
        var PAW = "#ffffff"; // 발, 주둥이, 꼬리끝
        var EAR_IN = "#efa2b2"; // 귀 안쪽

        // 비율 — 작업대(tiger-lab.html)에서 확정한 값
        var HEAD_SCALE = 1.14; // 머리 확대 배율
        var BODY_W = 36; // 몸통 폭
        var BODY_H = 25; // 몸통 높이

        function leg(x, topY, dx, dy) {
          ctx.beginPath();
          ctx.moveTo(x, topY);
          ctx.lineTo(x + dx, dy - 2);
          ctx.stroke();
        }

        // 등 줄무늬: 살짝 휜 선
        function bstripe(x1, y1, x2, y2, bend) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo((x1 + x2) / 2 + bend, (y1 + y2) / 2, x2, y2);
          ctx.stroke();
        }

        function qpt(p0, p1, p2, t) {
          var u = 1 - t;
          return [
            u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
            u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]
          ];
        }

        // 꼬리 곡선에서 t 구간만 잘라 그린다 (꼬리 줄무늬용)
        function tailBand(p0, p1, p2, t0, t1, color, w, cap) {
          ctx.strokeStyle = color;
          ctx.lineWidth = w;
          ctx.lineCap = cap;
          ctx.beginPath();
          for (var i = 0; i <= 8; i++) {
            var p = qpt(p0, p1, p2, t0 + ((t1 - t0) * i) / 8);
            if (i === 0) ctx.moveTo(p[0], p[1]);
            else ctx.lineTo(p[0], p[1]);
          }
          ctx.stroke();
        }

        // 흰 앞발/뒷발
        function paw(x, y) {
          ctx.fillStyle = PAW;
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.ellipse(x, y, 4.6, 3.4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // 바깥으로 휘어 내려온 윗 송곳니.
        // 뿌리(rootX, rootY)에서 시작해 끝이 바깥쪽으로 벌어지는 초승달 모양.
        // outward 가 -1 이면 왼쪽 송곳니(좌우 반전).
        function fang(rootX, rootY, w, len, outward) {
          ctx.save();
          ctx.translate(rootX, rootY);
          ctx.scale(outward, 1);
          var hw = w / 2;
          ctx.beginPath();
          ctx.moveTo(-hw, 0); // 뿌리 안쪽
          // 안쪽 모서리: 오목하게 훑어 내려가 끝점으로
          ctx.quadraticCurveTo(-hw + len * 0.1, len * 0.55, len * 0.42, len * 0.96);
          // 바깥 모서리: 볼록하게 뿌리로 되돌아옴
          ctx.quadraticCurveTo(hw + len * 0.24, len * 0.3, hw, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawTiger(cx, feetY, phase, airborne) {
          ctx.save();
          ctx.translate(cx, feetY);

          // 그림자 (공중에서는 작아진다)
          ctx.fillStyle = "rgba(40,60,80,0.16)";
          var sc = airborne ? 0.55 : 1;
          ctx.beginPath();
          ctx.ellipse(20, 1, (BODY_W * 0.64 + 2) * sc, 4 * sc, 0, 0, Math.PI * 2);
          ctx.fill();

          var swing = airborne ? 0 : Math.sin(phase * Math.PI * 2);
          var swingB = airborne ? 0 : Math.sin(phase * Math.PI * 2 + Math.PI);
          ctx.translate(0, airborne ? 0 : -Math.abs(swing) * 1.6);
          var lift = airborne ? 8 : 0;

          // 꼬리: 검은 윤곽 + 진한 파란 띠 두 줄 + 흰 꼬리끝
          var p0 = [4, -11 - BODY_H * 0.55];
          var p1 = [-11, -28 - lift - swing * 3];
          var p2 = [-15, -40 - lift - swing * 4];
          tailBand(p0, p1, p2, 0, 1, INK, 9, "round");
          tailBand(p0, p1, p2, 0, 1, FUR, 7, "round");
          tailBand(p0, p1, p2, 0.28, 0.42, STRIPE, 7, "butt");
          tailBand(p0, p1, p2, 0.56, 0.7, STRIPE, 7, "butt");
          ctx.fillStyle = PAW;
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(p2[0], p2[1], 3.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 뒷다리
          var bkDx = airborne ? 6 : swingB * 8;
          var bkDy = airborne ? -7 : 0;
          ctx.lineCap = "round";
          ctx.strokeStyle = INK;
          ctx.lineWidth = 9.8;
          leg(9, -12, bkDx, bkDy);
          ctx.strokeStyle = FUR_D;
          ctx.lineWidth = 8;
          leg(9, -12, bkDx, bkDy);
          paw(9 + bkDx, bkDy - 2);

          // 몸통
          ctx.fillStyle = FUR;
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.6;
          var bTop = -11 - BODY_H; // 몸통 윗선
          roundRect(0, bTop, BODY_W, BODY_H, Math.min(12, BODY_H / 2));
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = BELLY; // 가슴/배
          roundRect(6, bTop + BODY_H * 0.44, BODY_W - 10, BODY_H * 0.5, 7);
          ctx.fill();

          ctx.strokeStyle = STRIPE; // 등 줄무늬 4줄 (몸통 크기에 맞춰 자동 배치)
          ctx.lineWidth = 3.4;
          ctx.lineCap = "round";
          for (var si = 0; si < 4; si++) {
            var sx = BODY_W * (0.22 + si * 0.19);
            bstripe(sx, bTop + 1.5, sx - 1, bTop + BODY_H * 0.6, -1.2);
          }

          // 앞다리
          var frDx = airborne ? -7 : swing * 8;
          var frDy = airborne ? -8 : 0;
          ctx.strokeStyle = INK;
          ctx.lineWidth = 9.8;
          leg(28, -12, frDx, frDy);
          ctx.strokeStyle = FUR;
          ctx.lineWidth = 8;
          leg(28, -12, frDx, frDy);
          paw(28 + frDx, frDy - 2);

          // 머리
          var hx = 37;
          var hy = -40;

          ctx.save();
          ctx.translate(hx, hy);
          ctx.scale(HEAD_SCALE, HEAD_SCALE);
          ctx.translate(-hx, -hy);

          ctx.fillStyle = FUR;
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(hx, hy, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = FUR_D; // 귀
          ctx.beginPath();
          ctx.arc(hx - 11, hy - 12, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(hx + 11, hy - 12, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = EAR_IN;
          ctx.beginPath();
          ctx.arc(hx - 11, hy - 12, 2.9, 0, Math.PI * 2);
          ctx.arc(hx + 11, hy - 12, 2.9, 0, Math.PI * 2);
          ctx.fill();

          // 주둥이 + 볼 털
          ctx.fillStyle = PAW;
          ctx.beginPath();
          ctx.ellipse(hx + 1, hy + 8, 11.5, 7.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(hx - 10, hy + 5, 5, 0, Math.PI * 2);
          ctx.arc(hx + 12, hy + 5, 4.5, 0, Math.PI * 2);
          ctx.fill();

          // 이마의 임금 왕(王) — 조선 호랑이 표식
          ctx.strokeStyle = STRIPE;
          ctx.lineWidth = 1.9;
          ctx.lineCap = "round";
          var wy = hy - 9.5;
          line(hx - 4.5, wy - 2.6, hx + 4.5, wy - 2.6);
          line(hx - 3.2, wy, hx + 3.2, wy);
          line(hx - 4.5, wy + 2.6, hx + 4.5, wy + 2.6);
          line(hx, wy - 2.6, hx, wy + 2.6);

          ctx.lineWidth = 2.4; // 볼 줄무늬
          line(hx - 14.8, hy - 4.5, hx - 10.5, hy - 5.5);
          line(hx - 14.5, hy + 0.5, hx - 10.5, hy - 0.5);
          line(hx + 14.8, hy - 4.5, hx + 11.5, hy - 5.5);

          // 눈: 진한 형광 주황 + 검은 세로 동공
          var eyes = [[hx - 6, hy + 1], [hx + 7, hy + 1]];
          for (var ei = 0; ei < 2; ei++) {
            var ex = eyes[ei][0];
            var ey = eyes[ei][1];
            ctx.fillStyle = EYE_RIM;
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(ex, ey, 4.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = EYE;
            ctx.beginPath();
            ctx.arc(ex, ey + 0.2, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = EYE_HOT;
            ctx.beginPath();
            ctx.arc(ex, ey + 0.4, 1.9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = INK;
            ctx.beginPath();
            ctx.ellipse(ex + 0.3, ey + 0.5, 1.15, 2.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(ex - 1.4, ey - 1.5, 0.95, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = INK; // 코
          ctx.beginPath();
          ctx.moveTo(hx - 1.5, hy + 5.5);
          ctx.lineTo(hx + 4.5, hy + 5.5);
          ctx.quadraticCurveTo(hx + 1.5, hy + 10, hx - 1.5, hy + 5.5);
          ctx.closePath();
          ctx.fill();

          // 다문 입: 양옆으로 길게 뻗어 송곳니 바깥까지 이어진다
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(hx + 1.5, hy + 9);
          ctx.quadraticCurveTo(hx - 2.5, hy + 14, hx - 8, hy + 10);
          ctx.moveTo(hx + 1.5, hy + 9);
          ctx.quadraticCurveTo(hx + 5.5, hy + 14, hx + 11, hy + 10);
          ctx.stroke();

          // 입 양 끝에서 바깥으로 휘어 내려온 윗 송곳니 두 개
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.1;
          ctx.lineJoin = "round";
          fang(hx - 3.5, hy + 11, 3.4, 10, -1);
          fang(hx + 6.5, hy + 11, 3.4, 10, 1);

          ctx.restore(); // 머리 확대 해제
          ctx.restore();
        }

        // ============================================================
        // HUD / 안내 화면
        // ============================================================
        function drawHUD() {
          ctx.save();
          ctx.font = 'bold 16px "Courier New", monospace';
          ctx.textAlign = "right";
          ctx.textBaseline = "top";
          ctx.fillStyle = "#8a7a63";
          ctx.fillText("HI " + pad5(highScore), W - 120, 16);
          // 100점 구간마다 점수를 깜빡여 강조
          var blink = flashTimer > 0 && Math.floor(flashTimer / 7) % 2 === 0;
          ctx.fillStyle = blink ? "#c2410c" : "#4a3f31";
          ctx.fillText(pad5(score), W - 20, 16);
          ctx.restore();
        }

        function panel(y, h) {
          ctx.fillStyle = "rgba(253,250,244,0.94)";
          ctx.strokeStyle = "rgba(120,100,75,0.35)";
          ctx.lineWidth = 2;
          roundRect(W / 2 - 205, y, 410, h, 14);
          ctx.fill();
          ctx.stroke();
        }

        function drawStartScreen() {
          ctx.save();
          panel(72, 120);
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          ctx.fillStyle = "#4a3f31";
          ctx.font = 'bold 28px "Malgun Gothic", system-ui, sans-serif';
          ctx.fillText("조선 호랑이 뜀박질", W / 2, 118);
          ctx.fillStyle = "#7a684f";
          ctx.font = '14px "Malgun Gothic", system-ui, sans-serif';
          ctx.fillText("Space / ↑ 키 또는 화면을 탭하면 시작합니다", W / 2, 152);
          ctx.restore();
        }

        function drawGameOverScreen() {
          ctx.save();
          panel(66, 142);
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";

          ctx.fillStyle = "#8a2b16";
          ctx.font = 'bold 28px "Malgun Gothic", system-ui, sans-serif';
          ctx.fillText("게임 종료", W / 2, 110);

          ctx.fillStyle = "#4a3f31";
          ctx.font = 'bold 17px "Courier New", monospace';
          ctx.fillText(
            "SCORE " + pad5(score) + "    HI " + pad5(highScore),
            W / 2,
            142
          );

          if (isNewRecord) {
            ctx.fillStyle = "#c2410c";
            ctx.font = 'bold 14px "Malgun Gothic", system-ui, sans-serif';
            ctx.fillText("신기록!", W / 2, 166);
          }

          ctx.fillStyle = "#7a684f";
          ctx.font = '14px "Malgun Gothic", system-ui, sans-serif';
          ctx.fillText("Press Space or Tap to Restart", W / 2, 191);
          ctx.restore();
        }

        // ============================================================
        // 렌더
        // ============================================================
        function render() {
          ctx.clearRect(0, 0, W, H);

          drawSky();
          drawClouds();
          drawRidge(bgFar * 0.6, 400, FAR_RIDGE, 126, "#c6cfd8");
          drawRidge(bgFar, 340, NEAR_RIDGE, 156, "#aab7c3");
          drawHanok();
          drawGround();

          for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);

          drawTiger(player.x, player.y, player.runPhase, !player.isGrounded);
          drawHUD();

          if (gameState === "START") drawStartScreen();
          else if (gameState === "GAMEOVER") drawGameOverScreen();
        }

        // ============================================================
        // 메인 루프 (델타 타임 보정)
        // ============================================================
        function loop(ts) {
          rafId = null;

          if (!lastTs) lastTs = ts;
          var dt = (ts - lastTs) / (1000 / 60); // 60fps를 1.0으로 정규화
          lastTs = ts;
          if (dt > MAX_DT) dt = MAX_DT; // 탭 복귀 시 순간이동/가속 방지
          if (dt < 0) dt = 0;

          update(dt);
          render();

          // 게임오버면 여기서 애니메이션 루프를 멈춘다.
          if (gameState !== "GAMEOVER") rafId = requestAnimationFrame(loop);
        }

        rafId = requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
